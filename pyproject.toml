[project]
name = "crema"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "evdev",
    "adafruit-circuitpython-adxl34x",
    "click",
    "fastapi",
    "uvicorn[standard]",
    "httpx2",
    "itsdangerous",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
crema = "cli.main:cli"
crema-monitor = "ops.monitoring:main"

[tool.setuptools]
py-modules = ["config", "main"]
packages   = ["core", "hardware", "cli", "api", "api.routers", "devsim", "ops"]

[tool.setuptools.package-data]
devsim = ["panel.html"]
