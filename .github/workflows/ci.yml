name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest -q -W error
      - run: python -m compileall -q api cli core hardware main.py config.py devsim ops
      - run: python scripts/export_openapi.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
        working-directory: .
      - uses: actions/setup-node@v5
        with:
          node-version: "24.15"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code src/generated/api.ts
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - name: Upload Chromium failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-e2e-artifacts
          path: output/e2e/
          if-no-files-found: warn
          retention-days: 7
